version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: netpulse_postgres
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: netpulse123
      POSTGRES_DB: netpulse_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netpulse']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netpulse_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: netpulse_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: netpulse
      RABBITMQ_DEFAULT_PASS: netpulse123
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netpulse_backend
    environment:
      DATABASE_URL: postgresql://netpulse:netpulse123@postgres:5432/netpulse_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://netpulse:netpulse123@rabbitmq:5672
      JWT_SECRET: netpulse_jwt_secret_key_2024
      JWT_REFRESH_SECRET: netpulse_refresh_secret_key_2024
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netpulse_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
