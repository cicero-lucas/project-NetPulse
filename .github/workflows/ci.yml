name: NetPulse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: netpulse
          POSTGRES_PASSWORD: netpulse123
          POSTGRES_DB: netpulse_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://netpulse:netpulse123@localhost:5432/netpulse_test
      - name: Run backend tests
        run: npm test -- --coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://netpulse:netpulse123@localhost:5432/netpulse_test
          JWT_SECRET: test_secret
          JWT_REFRESH_SECRET: test_refresh_secret

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test -- --passWithNoTests
        working-directory: frontend

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t netpulse-backend ./backend
      - name: Build frontend image
        run: docker build -t netpulse-frontend ./frontend
